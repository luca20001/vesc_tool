name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "mobile oder full"
        required: true
        default: mobile
        type: choice
        options: [mobile, full]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Qt 5.15.2 fuer Android installieren
        uses: jurplel/install-qt-action@v4
        with:
          version: "5.15.2"
          host: linux
          target: android
          arch: android
          setup-python: false
          cache: true

      - name: Android NDK r21e installieren
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e
          add-to-path: false

      - name: APK bauen
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_HOST: linux-x86_64
          ANDROID_NDK_PLATFORM: android-23
        run: |
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          QT_BIN=$(dirname "$(which qmake)")
          if [ "${{ inputs.variant || 'mobile' }}" = "mobile" ]; then
            CFG="CONFIG += release_android build_mobile"
          else
            CFG="CONFIG += release_android"
          fi
          qmake -config release "$CFG" ANDROID_ABIS="arm64-v8a" -spec android-clang
          make -j"$(nproc)"
          make install INSTALL_ROOT=build/android/build
          "$QT_BIN/androiddeployqt" --gradle --no-gdbserver \
            --output build/android/build \
            --input android-vesc_tool-deployment-settings.json \
            --android-platform android-33
          mkdir -p out
          cp build/android/build/build/outputs/apk/debug/*.apk out/vesc_tool.apk

      - uses: actions/upload-artifact@v4
        with:
          name: vesc_tool_apk
          path: out/*.apk
